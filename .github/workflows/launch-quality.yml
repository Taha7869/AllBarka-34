name: Launch quality checks

on:
  pull_request:
    branches: [launch, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOG_SOURCE: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and React hooks
        run: npm run typecheck && npm run lint:hooks
      - name: Build and run the full offline commerce suite
        run: npm test
