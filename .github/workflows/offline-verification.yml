name: AllBarka offline verification

on:
  push:
    branches: [main, launch, codex/admin-catalog-foundation-20261023]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: offline-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLBARKA_SKIP_LOCAL_ENV: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.9.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the locked Playwright Chromium and Linux libraries
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Select the installed browser
        run: node --input-type=module -e "import {chromium} from 'playwright-core'; console.log('ALLBARKA_TEST_BROWSER=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Typecheck
        run: npm run typecheck
      - name: Hooks lint
        run: npm run lint:hooks
      - name: Production build and release privacy audit
        run: npm run build
      - name: Complete offline regression gate
        run: node scripts/run-all-tests.mjs
