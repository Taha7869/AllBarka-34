<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C7982F"/>
      <stop offset="100%" stop-color="#8C6B1B"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#073B30"/>
      <stop offset="100%" stop-color="#042821"/>
    </radialGradient>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Decorative inner ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2, 2" opacity="0.65"/>
  
  <!-- Royal Crown / Lotus Crest Peak -->
  <path d="M36 33 L50 22 L64 33 L58 37 L50 28 L42 37 Z" fill="url(#goldGrad)"/>
  <circle cx="50" cy="19" r="2.5" fill="url(#goldGrad)"/>
  
  <!-- Monogram AB -->
  <text x="50" y="65" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="34" 
        font-weight="700" 
        font-style="italic"
        letter-spacing="-1"
        fill="url(#goldGrad)" 
        text-anchor="middle">
    AB
  </text>
  
  <!-- Small Star Beneath -->
  <polygon points="50,73 52,78 57,78 53,81 55,86 50,83 45,86 47,81 43,78 48,78" fill="url(#goldGrad)" opacity="0.85"/>
</svg>
